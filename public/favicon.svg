<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Peon mark — flat gold silhouette, dark features. Same art serves as
       browser favicon and AppNav logo (T4). Keep fills literal (no CSS). -->
  <g>
    <!-- ears -->
    <path fill="#dbb571" d="M11 31 L2.5 27 L6 43 L13 47 Z"/>
    <path fill="#dbb571" d="M53 31 L61.5 27 L58 43 L51 47 Z"/>
    <!-- head: rounded face with heavy jaw -->
    <path fill="#dbb571" d="M32 3 C17 3 9 13 9 30 C9 48 19 60 32 60 C45 60 55 48 55 30 C55 13 47 3 32 3 Z"/>
    <!-- bandana crown (follows the skull silhouette) -->
    <path fill="#b98d4f" d="M32 3 C20.6 3 13.25 8.77 10.37 19 L53.63 19 C50.75 8.77 43.4 3 32 3 Z"/>
    <!-- dark brow line under the bandana -->
    <path fill="#332619" d="M10.37 19 L53.63 19 L54.32 22 L9.68 22 Z"/>
    <!-- bandana knot + tails (right side) -->
    <path fill="#b98d4f" d="M47 11 L61 5 L57 13 L60.5 19 L48 20 Z"/>
    <!-- eyes: angled angry slits -->
    <path fill="#332619" d="M15 26.5 L26.5 32 L26.5 37 L15 31.5 Z"/>
    <path fill="#332619" d="M49 26.5 L37.5 32 L37.5 37 L49 31.5 Z"/>
    <!-- nose -->
    <path fill="#332619" d="M29 39 L35 39 L32 43.5 Z"/>
    <!-- mouth band -->
    <path fill="#332619" d="M17 43.5 C24 47.5 40 47.5 47 43.5 L47 49.5 C40 55.5 24 55.5 17 49.5 Z"/>
    <!-- tusks rising over the mouth band -->
    <path fill="#dbb571" d="M20 55 L23 47.6 L26.4 47.6 L27.6 55 Z"/>
    <path fill="#dbb571" d="M44 55 L41 47.6 L37.6 47.6 L36.4 55 Z"/>
  </g>
</svg>
